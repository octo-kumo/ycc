<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Y Playground</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<style>
  :root { color-scheme: dark; --bg: #1e1e1e; --bg2: #252526; --bg3: #2d2d2d; --border: #3e3e3e; --text: #d4d4d4; --accent: #0078d4; --green: #4ec9b0; --red: #f14c4c; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font: 13px/1.5 -apple-system, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; align-items: center; gap: 10px; padding: 6px 12px; background: var(--bg2); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  header h1 { font-size: 14px; font-weight: 600; }
  header .tag { font-size: 11px; color: #888; }
  header .spacer { flex: 1; }
  #status { font-size: 11px; color: #888; }
  .btn { background: var(--accent); color: #fff; border: 0; padding: 4px 14px; border-radius: 4px; font-size: 12px; cursor: pointer; font-weight: 600; }
  .btn:hover { filter: brightness(1.15); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn-sm { padding: 2px 8px; font-size: 11px; }
  .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
  .btn-ghost:hover { background: var(--bg3); }
  main { flex: 1; display: flex; min-height: 0; }
  /* sidebar */
  #sidebar { width: 200px; background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
  #sidebar .head { padding: 8px 10px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: #888; display: flex; justify-content: space-between; align-items: center; }
  #tree { flex: 1; overflow-y: auto; padding: 2px 0; }
  .tree-item { display: flex; align-items: center; gap: 6px; padding: 3px 10px 3px 12px; cursor: pointer; font-size: 12px; white-space: nowrap; }
  .tree-item:hover { background: var(--bg3); }
  .tree-item.active { background: #37373d; }
  .tree-item .icon { width: 14px; text-align: center; font-size: 11px; }
  .tree-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .tree-item .run-btn { opacity: 0; background: var(--green); color: #000; border: 0; border-radius: 3px; font-size: 10px; padding: 1px 6px; cursor: pointer; font-weight: 700; }
  .tree-item:hover .run-btn { opacity: 1; }
  .tree-item .del-btn { opacity: 0; background: none; border: 0; color: var(--red); cursor: pointer; font-size: 13px; padding: 0 2px; }
  .tree-item:hover .del-btn { opacity: .6; }
  .tree-item .del-btn:hover { opacity: 1; }
  /* editor + output */
  #center { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #editor-wrap { flex: 1; min-height: 0; position: relative; }
  #editor-wrap .CodeMirror { height: 100%; font-size: 13px; }
  #output-wrap { height: 180px; border-top: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
  #output-wrap .head { padding: 4px 10px; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: #888; background: var(--bg2); display: flex; justify-content: space-between; align-items: center; }
  #output { flex: 1; overflow-y: auto; padding: 8px 12px; font: 12px/1.6 'SF Mono', 'Fira Code', 'Consolas', monospace; background: #1a1a1a; white-space: pre-wrap; word-break: break-all; }
  #output .err { color: var(--red); }
  #output .ok { color: var(--green); }
  /* resize handle */
  #resize { height: 4px; cursor: ns-resize; background: var(--border); flex-shrink: 0; }
  #resize:hover { background: var(--accent); }
  /* diagnostics */
  #diagnostics-wrap { height: 120px; border-top: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
  #diagnostics-wrap .head { padding: 4px 10px; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: #888; background: var(--bg2); display: flex; justify-content: space-between; align-items: center; }
  #diag-count { font-size: 10px; color: var(--accent); }
  #diagnostics { flex: 1; overflow-y: auto; padding: 4px 12px; font: 11px/1.5 'SF Mono', 'Fira Code', 'Consolas', monospace; background: #1a1a1a; }
  .diag-item { padding: 2px 0; color: var(--text); }
  .diag-item.error { color: var(--red); }
  .diag-item.warning { color: #d7ba7d; }
  .diag-item .loc { color: #888; margin-right: 8px; }
</style>
</head>
<body>
<header>
  <h1>Y Playground</h1>
  <span class="tag">Y compiler → WASM · runs in your browser</span>
  <span class="spacer"></span>
  <span id="status">loading compiler…</span>
  <button class="btn btn-ghost" id="export-btn" disabled onclick="exportWasm()">⬇ Export native wasm</button>
  <button class="btn" id="run-btn" disabled onclick="runActive()">▶ Run</button>
</header>
<main>
  <div id="sidebar">
    <div class="head">
      <span>Explorer</span>
      <button class="btn btn-sm btn-ghost" onclick="newFile()">+ New</button>
    </div>
    <div id="tree"></div>
  </div>
  <div id="center">
    <div id="editor-wrap"><textarea id="editor"></textarea></div>
    <div id="resize"></div>
    <div id="output-wrap">
      <div class="head"><span>Output</span><button class="btn btn-sm btn-ghost" onclick="clearOutput()">Clear</button></div>
      <div id="output"></div>
    </div>
    <div id="diagnostics-wrap">
      <div class="head"><span>Diagnostics</span><span id="diag-count"></span></div>
      <div id="diagnostics"></div>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
<script src="y-mode.js"></script>
<script src="ycc-single.js"></script>
<script src="emit-as.js"></script>
<script src="check.js"></script>
<script src="app.js"></script>
</body>
</html>
