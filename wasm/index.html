<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Y Playground — in-browser Y compiler (WASM)</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, sans-serif; background: #0d1117; color: #c9d1d9; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 10px 16px; background: #161b22; border-bottom: 1px solid #30363d; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .tag { font-size: 11px; color: #7d8590; }
  main { flex: 1; display: flex; min-height: 0; }
  #editor { flex: 1; padding: 14px; border: 0; border-right: 1px solid #30363d; background: #0d1117; color: #c9d1d9; font: 13px/1.6 ui-monospace, "SF Mono", Menlo, monospace; resize: none; outline: none; tab-size: 4; }
  #pane { width: 42%; display: flex; flex-direction: column; }
  #out { flex: 1; padding: 14px; margin: 0; overflow: auto; font: 13px/1.6 ui-monospace, monospace; white-space: pre-wrap; background: #010409; }
  #out .err { color: #f85149; }
  button { background: #238636; color: #fff; border: 0; padding: 6px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
  button:hover { background: #2ea043; }
  button:disabled { background: #21262d; color: #7d8590; cursor: default; }
  .status { font-size: 12px; color: #7d8590; }
</style>
</head>
<body>
<header>
  <h1>Y Playground</h1>
  <span class="tag">Y compiler running as WebAssembly in your browser</span>
  <span style="flex:1"></span>
  <span class="status" id="status">loading compiler…</span>
  <button id="run" disabled>▶ Run (Ctrl+Enter)</button>
</header>
<main>
  <textarea id="editor" spellcheck="false">// Welcome to Y! This compiler is a ~72KB wasm module
// running entirely in your browser. Edit and hit Run.

def fib(n: long) -> long {
    if (n < 2) { n } else { self(n - 1) + self(n - 2) }
};

let i = 0;
while (i < 10) {
    print("fib(" + tostring(i) + ") = " + tostring(fib(i)));
    i = i + 1;
};
</textarea>
  <div id="pane">
    <pre id="out"></pre>
  </div>
</main>

<script src="ycc-single.js"></script>
<script>
let ycc = null;
const $ = id => document.getElementById(id);
const status = $('status'), out = $('out'), run = $('run'), editor = $('editor');

createYcc({ print(){}, printErr(){} }).then(m => {
  ycc = m;
  status.textContent = 'compiler ready (' + (Math.round(204)) + 'KB wasm)';
  run.disabled = false;
});

function runProgram() {
  if (!ycc) return;
  out.textContent = '';
  let buf = '';
  const flush = (cls, t) => {
    const span = document.createElement('span');
    if (cls) span.className = cls;
    span.textContent = t + '\n';
    out.appendChild(span);
  };
  // Fresh module per run so global state doesn't leak between runs.
  createYcc({
    print: t => flush(null, t),
    printErr: t => flush('err', t),
  }).then(m => {
    try {
      m.FS.writeFile('/prog.y', editor.value);
      m.callMain(['/prog.y']);
    } catch (e) {
      flush('err', String(e));
    }
  });
}

run.addEventListener('click', runProgram);
editor.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); runProgram(); }
});
</script>
</body>
</html>
